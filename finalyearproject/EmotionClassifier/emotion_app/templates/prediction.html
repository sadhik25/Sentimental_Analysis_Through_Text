{% extends 'base.html' %}
{% block content %}
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .heading4 h2 {
        font-size: 50px;
        color: black;
        font-family: "Trirong", serif;

    }
    .button3{
        border-radius: 12px;
    }
</style>
<div
style="
width: 100%;
height: 90%;
display: flex;
align-items: center;
justify-content: center;">
    <div class="heading4">
        <h2>Emotion Prediction</h2>
        {% if prediction %}
        <p>Predicted Emotion: {{ prediction }} </p>
        <p>Predicted confience score: {{ confidence_score }} </p>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <textarea name="text_input" placeholder="Enter text for emotion prediction"></textarea>
            <button class="button3" type="submit">Predict</button>
    </div>
</div>
</form>
{% endblock %}
